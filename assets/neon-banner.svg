<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="300" viewBox="0 0 1100 300" role="img" aria-label="Malith Gimhana, Computer Science Undergraduate, cyberpunk neon banner">
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#080616"/><stop offset=".6" stop-color="#130c2a"/><stop offset="1" stop-color="#071a2a"/></linearGradient>
 <linearGradient id="neon"><stop stop-color="#b66bff"/><stop offset=".55" stop-color="#e4a5ff"/><stop offset="1" stop-color="#45f5ff"/></linearGradient>
 <filter id="glow" x="-30%" y="-100%" width="160%" height="300%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#5b3e9d" stroke-opacity=".16"/></pattern>
 <clipPath id="type"><rect x="70" y="205" width="0" height="36"><animate attributeName="width" values="0;660;660" dur="7s" repeatCount="indefinite" keyTimes="0;.45;1"/></rect></clipPath>
</defs>
<rect width="1100" height="300" rx="22" fill="url(#bg)"/>
<rect width="1100" height="300" rx="22" fill="url(#grid)"/>
<g fill="none" stroke-width="2" opacity=".7"><path d="M15 85V22H85" stroke="#b66bff"/><path d="M1015 278h65v-65" stroke="#45f5ff"/><path d="M750 35h160l40 40h125" stroke="#8a55ff"/><path d="M800 245h160l40-40h80" stroke="#1bdbe8"/></g>
<g opacity=".5"><circle cx="938" cy="147" r="90" fill="none" stroke="#9a57ff" stroke-width="1.5" stroke-dasharray="8 11"><animateTransform attributeName="transform" type="rotate" from="0 938 147" to="360 938 147" dur="32s" repeatCount="indefinite"/></circle><circle cx="938" cy="147" r="63" fill="none" stroke="#34e9ff" stroke-dasharray="3 9"/><path d="M895 147h86M938 104v86" stroke="#a878ff"/></g>
<text x="70" y="65" font-family="monospace" font-size="17" letter-spacing="4" fill="#44f0ff">&lt; DEVELOPER PROFILE /&gt;</text>
<text x="70" y="155" font-family="Arial,Helvetica,sans-serif" font-size="63" font-weight="800" letter-spacing="2" fill="url(#neon)" filter="url(#glow)">MALITH GIMHANA</text>
<path d="M70 172h660" stroke="#a95bff" stroke-width="2"><animate attributeName="stroke-opacity" values=".3;1;.3" dur="3s" repeatCount="indefinite"/></path>
<g clip-path="url(#type)"><text x="70" y="229" font-family="monospace" font-size="22" fill="#d9d3ef">Computer Science Undergraduate | Building What's Next_</text></g>
<rect x="70" y="256" width="8" height="13" fill="#40edff"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></rect>
<text x="90" y="267" font-family="monospace" font-size="13" letter-spacing="2" fill="#a5a0c5">SRI LANKA  •  LEARN / BUILD / EVOLVE</text>
</svg>
